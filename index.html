<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Payment Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Client Payment Tracker</h1>
  <div id="userBar"></div>
</header>

<main id="app">
  <div id="loginView" class="view">
    <form id="loginForm">
      <h2>Sign in</h2>
      <p class="hint" id="loginMsg">Enter your access password.</p>
      <input id="pwInput" type="password" placeholder="Password" autofocus>
      <button type="submit">Open Tracker</button>
    </form>
  </div>

  <div id="dashView" class="view hidden">
    <div class="toolbar">
      <button id="addBtn">+ Add Client</button>
      <button id="exportCsvBtn" class="ghost">Export CSV</button>
      <button id="reportBtn" class="ghost">Summary Report</button>
      <input id="search" placeholder="Search client...">
      <span id="summary"></span>
    </div>
    <div class="tableWrap">
      <table id="clientsTable"></table>
    </div>
  </div>
</main>

<dialog id="detailDialog">
  <div id="detailContent"></div>
  <div class="actions">
    <button id="statementBtn" class="ghost" type="button">Print Statement</button>
    <button id="editBtn" class="ghost" type="button">Edit</button>
    <button id="deleteBtn" class="ghost danger" type="button">Delete</button>
    <button id="closeDetailBtn" type="button">Close</button>
  </div>
</dialog>

<dialog id="clientDialog">
  <form method="dialog">
    <h3 id="dialogTitle">Add Client</h3>
    <label>Client <input name="Client" required></label>
    <label>Phone <input name="Phone"></label>
    <label>Loan Amount <input name="LoanAmount" type="number" step="0.01"></label>
    <label>Monthly <input name="Monthly" type="number" step="0.01"></label>
    <label>Term (months, 12-24) <input name="TermMonths" type="number" min="1" max="24" value="12"></label>
    <label>Start Date <input name="StartDate" type="date"></label>
    <label>Notes <input name="Notes"></label>
    <div class="actions">
      <button value="cancel">Cancel</button>
      <button id="saveBtn" value="save">Save</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
